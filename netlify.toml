# Netlify config for the Pipkin Law Firm design preview.
# No build step: Netlify serves the project root as-is.

[build]
  publish = "."

# PREVIEW SAFEGUARD: keep every page out of search engines so this demo
# never competes with the client's live site. Remove only at launch.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
